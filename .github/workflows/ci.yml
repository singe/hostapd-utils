name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source and hostapd submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libnl-3-dev \
            libnl-genl-3-dev \
            libssl-dev \
            python3

      - name: Run ifcap release matrix
        run: make -C ifcap test-all

      - name: Run hapdconf-check release matrix
        run: make -C hapdconf-check test-all
